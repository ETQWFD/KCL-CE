name: KCL CE Build & Release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 2.15.1-kcl.1）'
        required: true
        default: '2.15.1-kcl.1'
      prerelease:
        description: '是否为预发布'
        required: true
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

env:
  PCL_WRITE_SECRET: '1'

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - rid: win-x64
            arch: x64
          - rid: win-arm64
            arch: ARM64
    outputs:
      ver: ${{ steps.meta.outputs.ver }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - id: meta
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if (-not $v) { $v = "${GITHUB_REF_NAME}" -replace '^v','' }
          echo "ver=$v" >> $env:GITHUB_OUTPUT
          echo "VER=$v" >> $env:GITHUB_ENV

      - name: Publish single-file (${{ matrix.rid }})
        shell: pwsh
        run: |
          dotnet publish "Plain Craft Launcher 2/Plain Craft Launcher 2.csproj" `
            -c Release -p:Platform=${{ matrix.arch }} -r ${{ matrix.rid }} `
            --self-contained true -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None -p:DebugSymbols=false `
            -o artifact

      - name: Stage, hash, metadata
        shell: pwsh
        run: |
          $arch="${{ matrix.arch }}".ToLower(); $v="$env:VER"
          New-Item -ItemType Directory -Force -Path dist,stage,update/apiv2/updates | Out-Null
          # 只保留本架构清单，避免把 checkout 带来的另一架构旧清单一并上传，在 publish 合并时交叉覆盖
          Remove-Item "update/apiv2/updates/*.json" -ErrorAction SilentlyContinue
          # AssemblyName 已恢复为内部名 “Plain Craft Launcher 2”，发布产物默认即该名；对外重命名为 KCL CE.exe
          $src="artifact/Plain Craft Launcher 2.exe"
          if (-not (Test-Path $src)) { $src=(Get-ChildItem artifact -Filter *.exe | Select-Object -First 1).FullName }
          Copy-Item $src "stage/KCL CE.exe" -Force
          Copy-Item "stage/KCL CE.exe" "dist/KCL-CE-$v-$arch.exe" -Force
          Compress-Archive -Path "stage/KCL CE.exe" -DestinationPath "dist/KCL-CE-$v-$arch.zip" -Force
          $sha=(Get-FileHash "dist/KCL-CE-$v-$arch.zip" -Algorithm SHA256).Hash.ToLower()
          $base="https://github.com/ETQWFD/KCL-CE/releases/download/v$v/"
          # 更新清单中的 version.name 必须是“纯数字、比当前内置版本更大”的 SemVer，不能带 -kcl 预发布后缀（否则会被判为更旧而永不更新）
          $semver=($v -split '-')[0]
          # version.code 取自 metadata.json 并随版本递增；下载物为内含 KCL CE.exe 的 zip，故 sha256 对 zip 计算
          $metaCode=[int]((Get-Content "Plain Craft Launcher 2/metadata.json" -Raw | ConvertFrom-Json).version.code)
          $channel=[ordered]@{ assets=@([ordered]@{
            file_name="KCL-CE-$v-$arch.zip"
            version=@{channel="stable";name=$semver;code=$metaCode}
            upd_time=(Get-Date).ToString("yyyy-MM-dd HH:mm:ss")
            downloads=@($base+"KCL-CE-$v-$arch.zip")
            patches=@(); sha256=$sha; changelog="KCL CE $v：修复 Wine/精简系统点同意后白屏崩溃；品牌改 KCL；内置正版登录与下载解锁" }) }
          ($channel|ConvertTo-Json -Depth 8)|Out-File -Encoding utf8NoBOM "update/apiv2/updates/updates-sr$arch.json"
          Copy-Item "update/apiv2/updates/updates-sr$arch.json" "update/apiv2/updates/updates-fr$arch.json" -Force
          # 保留 main 上当前正在下发的公告，绝不在发版时清空（仅当仓库里缺失该文件时才初始化空数组）
          if (-not (Test-Path "update/apiv2/announcement.json")) { '{"content":[]}'|Out-File -Encoding utf8NoBOM "update/apiv2/announcement.json" }
          # cache.json：键=清单名，值=该文件 MD5
          $cache=@{}
          Get-ChildItem update/apiv2/updates/*.json | ForEach-Object {
            $cache[$_.BaseName]=((Get-FileHash $_.FullName -Algorithm MD5).Hash.ToLower())
          }
          $cache["announcement"]=((Get-FileHash update/apiv2/announcement.json -Algorithm MD5).Hash.ToLower())
          ($cache|ConvertTo-Json)|Out-File -Encoding utf8NoBOM "update/apiv2/cache.json"
          Write-Host "sha256=$sha semver=$semver src=$src"

      - uses: actions/upload-artifact@v4
        with:
          name: kcl-ce-${{ matrix.arch }}
          path: |
            dist/*
            update/**

  publish:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: alldist
      - name: Create release and commit metadata
        shell: pwsh
        run: |
          $v="${{ needs.build.outputs.ver }}"
          New-Item -ItemType Directory -Force -Path update/apiv2/updates | Out-Null
          Copy-Item alldist/kcl-ce-x64/update/apiv2/updates/* update/apiv2/updates/ -Force
          Copy-Item alldist/kcl-ce-arm64/update/apiv2/updates/* update/apiv2/updates/ -Force
          Copy-Item alldist/kcl-ce-x64/update/apiv2/announcement.json update/apiv2/announcement.json -Force
          # 合并双架构后重算 cache.json（键=清单名，值=MD5）
          $cache=[ordered]@{}
          Get-ChildItem update/apiv2/updates/*.json | ForEach-Object {
            $cache[$_.BaseName]=((Get-FileHash $_.FullName -Algorithm MD5).Hash.ToLower())
          }
          $cache['announcement']=((Get-FileHash update/apiv2/announcement.json -Algorithm MD5).Hash.ToLower())
          ($cache|ConvertTo-Json)|Out-File -Encoding utf8 update/apiv2/cache.json
          $files=@()
          Get-ChildItem -Recurse alldist -Include *.exe,*.zip | ForEach-Object { $files += $_.FullName }
          $pre='${{ github.event.inputs.prerelease }}'
          if ($pre -eq 'true') {
            gh release create "v$v" $files --title "KCL CE v$v" --notes "KCL CE $v" --prerelease --repo ETQWFD/KCL-CE
          } else {
            gh release create "v$v" $files --title "KCL CE v$v" --notes "KCL CE $v" --repo ETQWFD/KCL-CE
          }
          git config user.name "ETC Team"
          git config user.email "2416444244@qq.com"
          git add update
          git commit -m "update: KCL CE v$v metadata" || echo "no metadata change"
          git push origin HEAD:main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
