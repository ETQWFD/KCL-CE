name: Build

on:
  push:
    branches: [main]
    paths:
      - 'KCL2/**'
      - 'PCLCS/**'
      - 'MeloongCore/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'KCL2/**'
      - 'PCLCS/**'
      - 'MeloongCore/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: true

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Prepare Help
        shell: pwsh
        run: |
          git clone https://github.com/Meloong-Git/PCLHelp.git -b master --single-branch --depth 1 PCLHelp
          if (Test-Path 'PCLHelp') {
            Compress-Archive -Path 'PCLHelp\*' -DestinationPath 'KCL2\Resources\Help.zip' -Force
          }

      - name: Inject build metadata
        shell: bash
        run: |
          sed -i 's/Public Const CommitHash As String = ""/Public Const CommitHash As String = "${{ github.sha }}"/' "KCL2/Modules/Base/ModBase.vb"

      - name: Restore PCLCS packages
        run: dotnet restore PCLCS\PCLCS.csproj

      - name: Build PCLCS
        run: dotnet build PCLCS\PCLCS.csproj -c Release --no-restore

      - name: Build KCL2
        env:
          KCL2_MS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          KCL2_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: msbuild "KCL2.sln" /p:Configuration=Release /p:Platform="Any CPU" -m -v:minimal

      - name: Package portable release (single exe)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'publish\KCL2' | Out-Null
          # 单文件：所有托管程序集均已作为资源嵌入 KCL2.exe（运行时由 AssemblyResolve 从内存加载），
          # 因此发布目录只保留一个 exe；首次运行会在同目录生成 KCL 与 .minecraft 两个文件夹。
          Copy-Item -Path 'KCL2\bin\KCL2.exe' -Destination 'publish\KCL2\KCL2.exe' -Force
          Compress-Archive -Path 'publish\KCL2\KCL2.exe' -DestinationPath 'publish\KCL2-portable.zip' -Force

      - name: Build native dependency bootstrapper
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /O2 /EHsc /utf-8 /D_UNICODE /DUNICODE bootstrapper\KCL2DependencySetup.cpp /Fo:publish\setup.obj /Fe:publish\KCL2DependencySetup.exe /link wininet.lib shell32.lib user32.lib

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KCL2-portable
          path: publish/KCL2-portable.zip

      - name: Publish continuous release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'continuous'
          gh release delete $tag --yes --repo $env:GITHUB_REPOSITORY 2>$null
          gh release create $tag `
            --target $env:GITHUB_SHA `
            --title 'KCL2 Continuous Build' `
            --notes '自动构建的最新 Windows 单文件版。解压后仅一个 KCL2.exe，首次运行生成 KCL 与 .minecraft 两个文件夹。' `
            publish/KCL2-portable.zip publish/KCL2/KCL2.exe publish/KCL2DependencySetup.exe
