<style>*{box-sizing:border-box}body{margin:0;font-family:Inter,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#14231a;background:#f5faf6;line-height:1.7}a{color:#087a43;text-decoration:none}a:hover{text-decoration:underline}.wrap{max-width:1080px;margin:0 auto;padding:0 24px}.hero{background:linear-gradient(135deg,#062b1c,#0b8a49);color:#fff;padding:88px 0 96px}.hero .wrap{display:grid;grid-template-columns:1.25fr .75fr;gap:42px;align-items:center}.badge{display:inline-block;padding:5px 12px;border:1px solid rgba(255,255,255,.35);border-radius:999px;font-size:13px;margin-bottom:18px}h1{font-size:52px;line-height:1.12;margin:0 0 18px;letter-spacing:-.04em}.hero p{font-size:18px;color:#dff8e8;margin:0 0 28px}.actions{display:flex;gap:14px;flex-wrap:wrap}.btn{display:inline-block;padding:12px 18px;border-radius:10px;font-weight:700}.btn:hover{text-decoration:none}.primary{background:#fff;color:#075d35}.ghost{border:1px solid rgba(255,255,255,.45);color:#fff}.panel{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:18px;padding:24px;backdrop-filter:blur(10px)}.panel strong{display:block;font-size:22px;margin-bottom:8px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin:42px 0}.card{background:#fff;border:1px solid #dce9df;border-radius:16px;padding:24px}.card h2{font-size:19px;margin:0 0 10px}.card p{margin:0;color:#435449}.section{padding:52px 0}.note{background:#fff7e8;border:1px solid #f0d49a;border-radius:14px;padding:18px 20px;color:#5f4210}footer{padding:36px 0;color:#728096;font-size:14px}.doc{background:#fff;border:1px solid #dce9df;border-radius:18px;padding:38px;margin:36px 0}.doc h1{font-size:40px;color:#10291b;letter-spacing:-.03em}.doc h2{margin-top:34px;color:#10291b}.doc h3{margin-top:24px}.doc code{background:#eaf5ee;padding:2px 6px;border-radius:5px}.doc ul,.doc ol{padding-left:22px}.table{width:100%;border-collapse:collapse;margin:14px 0}.table th,.table td{border-bottom:1px solid #dfe9e2;padding:10px;text-align:left}.table th{background:#eef8f1}.admin{min-height:100vh;background:#071a10;color:#e9eef7;display:flex;align-items:center;justify-content:center;padding:24px}.admin-box{width:100%;max-width:860px;background:#0d2417;border:1px solid #24452f;border-radius:18px;padding:28px}.admin input{width:100%;padding:13px 14px;border-radius:10px;border:1px solid #3a4b6b;background:#081f12;color:#fff;font-size:16px;margin:10px 0 16px}.admin button{padding:11px 18px;border:0;border-radius:10px;background:#0a9f55;color:#fff;font-weight:700;cursor:pointer}.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}.stat{background:#081f12;border:1px solid #234b32;border-radius:14px;padding:18px}.stat b{display:block;font-size:28px}.muted{color:#93a4bd;font-size:13px}.asset{display:flex;justify-content:space-between;gap:18px;padding:12px 0;border-bottom:1px solid #24452f}.hidden{display:none}@media(max-width:980px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:800px){.hero .wrap,.grid,.stat-grid{grid-template-columns:1fr}h1{font-size:38px}.doc{padding:24px}}</style>

<body class="admin">
<main class="admin"><div class="admin-box"><h1>KCL2 Release Stats</h1><p class="muted">未列表页面。数据来自 GitHub 公共 Release API；GitHub 提供下载次数，不提供去重后的真实人数。</p><div id="gate"><input id="pass" type="password" placeholder="访问口令" autocomplete="current-password"><button onclick="login()">进入</button></div><div id="panel" class="hidden"><div class="stat-grid"><div class="stat"><b id="tag">-</b><span>最新版本</span></div><div class="stat"><b id="latest">-</b><span>最新版下载次数</span></div><div class="stat"><b id="total">-</b><span>近 100 个 Release 总下载</span></div></div><h2>最新版本资产</h2><div id="assets"></div><p class="muted" id="published"></p></div></div><script>const repo="ETQWFD/KCL2";function login(){if(document.getElementById("pass").value==="1234"){sessionStorage.setItem("kcl_dan","1");show()}else{alert("口令不正确")}}function show(){document.getElementById("gate").classList.add("hidden");document.getElementById("panel").classList.remove("hidden");load()}async function getJson(u){const r=await fetch(u,{headers:{Accept:"application/vnd.github+json"}});if(!r.ok)throw new Error(r.status);return r.json()}function n(v){return new Intl.NumberFormat("zh-CN").format(v||0)}async function load(){try{const [latest,releases]=await Promise.all([getJson(`https://api.github.com/repos/${repo}/releases/latest`),getJson(`https://api.github.com/repos/${repo}/releases?per_page=100`)]);const latestCount=latest.assets.reduce((s,a)=>s+a.download_count,0);const total=releases.reduce((s,r)=>s+r.assets.reduce((x,a)=>x+a.download_count,0),0);document.getElementById("tag").textContent=latest.tag_name;document.getElementById("latest").textContent=n(latestCount);document.getElementById("total").textContent=n(total);document.getElementById("published").textContent="发布时间："+new Date(latest.published_at).toLocaleString("zh-CN");document.getElementById("assets").innerHTML=latest.assets.length?latest.assets.map(a=>`<div class="asset"><span>${a.name}</span><b>${n(a.download_count)}</b></div>`).join(""):"<p>暂无资产</p>"}catch(e){document.getElementById("assets").innerHTML="<p>暂时无法读取 GitHub 数据。公开仓库发布后可再试。</p>"}}if(sessionStorage.getItem("kcl_dan")==="1")show();</script></main>
</body>
